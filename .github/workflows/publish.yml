
name: Gardener - update, test and publish

on:
  schedule:
    - cron: "17 8 1 * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "gardener/**"
      - ".github/workflows/publish.yml"
  push:
    branches:
      - main
    paths:
      - "gardener/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: gardener-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/lobor/ha-gardener

jobs:
  check-upstream:
    name: Check upstream and open PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Detect upstream changes
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git ls-remote \
            https://github.com/mniedermaier/gardener.git \
            refs/heads/main | cut -f1)"

          if [ -z "$SHA" ]; then
            echo "Unable to read upstream commit"
            exit 1
          fi

          CURRENT="$(cat gardener/UPSTREAM_COMMIT 2>/dev/null || true)"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ "$SHA" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has not changed."
          fi

      - name: Update upstream SHA and add-on version
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "$UPSTREAM_SHA" > gardener/UPSTREAM_COMMIT

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("gardener/config.yaml")
          content = path.read_text()

          pattern = r'(?m)^version:\s*["\']?(\d+)\.(\d+)\.(\d+)["\']?\s*$'
          match = re.search(pattern, content)

          if not match:
              raise SystemExit("Version not found in gardener/config.yaml")

          major, minor, patch = map(int, match.groups())
          new_version = f"{major}.{minor}.{patch + 1}"

          content = re.sub(
              pattern,
              f'version: "{new_version}"',
              content,
              count=1,
          )

          path.write_text(content)
          print(f"Proposed add-on version: {new_version}")
          PY

      - name: Set up QEMU
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Test build for upstream commit
        if: steps.upstream.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./gardener
          file: ./gardener/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            GARDENER_REF=${{ steps.upstream.outputs.sha }}

      - name: Create or update pull request
        if: steps.upstream.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-gardener-upstream
          base: main
          delete-branch: true
          title: "chore: update upstream Gardener"
          commit-message: "chore: update upstream Gardener"
          body: |
            A new commit was detected in mniedermaier/gardener.

            This PR updates gardener/UPSTREAM_COMMIT and bumps the
            add-on version. The Docker image build is tested before
            the PR is created. Review and merge to publish the image.

  test-pr:
    name: Test Docker image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Read upstream SHA
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cat gardener/UPSTREAM_COMMIT)"
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./gardener
          file: ./gardener/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            GARDENER_REF=${{ steps.upstream.outputs.sha }}

  publish:
    name: Publish Docker image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Read version and upstream SHA
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version:[[:space:]]*["'\'']\{0,1\}\([^"'\'']*\)["'\'']\{0,1\}[[:space:]]*$/\1/p' gardener/config.yaml | head -n1)"
          SHA="$(cat gardener/UPSTREAM_COMMIT)"

          if [ -z "$VERSION" ] || [ -z "$SHA" ]; then
            echo "Version or upstream SHA is missing."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./gardener
          file: ./gardener/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GARDENER_REF=${{ steps.metadata.outputs.sha }}
          tags: |
            ghcr.io/lobor/ha-gardener:${{ steps.metadata.outputs.version }}
            ghcr.io/lobor/ha-gardener:latest
