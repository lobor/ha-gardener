
name: Build and publish Gardener

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate add-on files
        run: |
          set -eu
          test -f repository.yaml || {
            echo "::error::repository.yaml not found"
            exit 1
          }
          test -f gardener/config.yaml || {
            echo "::error::gardener/config.yaml not found"
            exit 1
          }
          test -f gardener/Dockerfile || {
            echo "::error::gardener/Dockerfile not found"
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' gardener/config.yaml | head -n1)"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./gardener
          file: ./gardener/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lobor/ha-gardener:${{ steps.version.outputs.value }}
            ghcr.io/lobor/ha-gardener:latest
